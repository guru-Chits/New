<div class="container-fluid d-flex flex-column">
    <app-breadcrumb [data]="breadcrumsData"></app-breadcrumb>

    <div class="row mx-5">
        <div class="col-lg-4">
            <div class="form-group">
                <label for="role" class="form-control-label">Role</label>
                <select type="text" class="form-control form-control-sm" formControlName="role">
                  <option value="">Role</option>
                  <option value="Field Staff">Field Staff</option>
                  <option value="Office Staff">Office Staff</option>
                      </select>
              </div>
        </div>
        <div class="col-lg-8">
            <div class=" form-group">
                <label class=" form-control-label" for="description">Description</label>
                <textarea class=" form-control" id="description" resize="none" rows="3" placeholder="Description" formControlName="description"></textarea>
              </div>

        </div>
      </div>
      <div class="row my-3 mx-5">
        <app-ag-grid [columns]="columns" [rowData]="data" width="100%" height="400px" [pageSize]="total"></app-ag-grid>

      </div>
      <div class="row justify-content-center">
        <div class="col-lg-10 d-flex justify-content-end mb-2">
            <button class="btn nxt-btn btn-outline-secondary">Save</button>
        </div>
    </div>
    
</div>
