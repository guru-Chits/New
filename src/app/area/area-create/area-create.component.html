<div class = "container-fluid">
    <div class = "row d-flex ">
        <div class = "col-lg-8">
           <div class = "d-flex col mt-2">
            <div class = "d-flex col">
                <app-breadcrumb [data]="breadcrumsData"></app-breadcrumb>
            </div>
            <div class = "d-flex col justify-content-end">
                <button class="btn">Create New Region</button>
            </div>
           </div>
           <div class="d-flex col ">
            <form class="form" [formGroup]="routeForm">
            <div class="d-flex row form-group mt-3 mb-2">
                <div class="col-lg-4">
                    <label class="simple-text">Region ID</label>
                    <input class = "form-control" placeholder="Enter your region" formControlName="regionId">    
                </div>
            <div class="col-lg-4">
                <label class="simple-text">Region Name</label>
                <input class = "form-control" placeholder="Enter your Region ID" formControlName ="regionName">
            </div>
            <div class="col-lg-4">
                <label class="simple-text">Route ID</label>
                <input class = "form-control" placeholder="Region Description" formControlName="routeId">
            </div>
        </div>
        <div class="d-flex row form-group mt-2 mb-5">
            <div class="col-lg-4">
                <label class="simple-text">Route Description</label>
                <input class = "form-control" placeholder="Region Description" formControlName="routeDescription">
            </div>
        </div>
        </form>
      </div>
      <div class="col d-flex">
        <div class="form-check form-switch switch-design">
            <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckChecked" checked>
            <label class="form-check-label" for="flexSwitchCheckChecked">Status of the Region</label>
          </div>
      </div>
      <div class="d-flex justify-content-end">
        <button class="btn1">Cancel</button>
        <button class="btn">Save</button>
      </div>
      <app-ag-grid [columns]="columns" [rowData]="rowData" width="100%" height="200px"></app-ag-grid> 
   
    </div>
     
     <div class="col-lg-4 d-flex mb-4">
        <div class="card ">
            <div class="card-body">
                    <h6 class="text-center">Route details</h6>
                    <table class="table simple-text">
                        <tbody>
                            <tr>
                                <td><b>Route ID</b></td>
                                <td>CMB-south</td>
                            </tr>
                            <tr>
                                <td><b>Region Name</b></td>
                                <td>Coimbatore</td>
                            </tr>
                            <tr>
                                <td><b>Route Name</b></td>
                                <td>Gandhipuram</td>
                            </tr>
                            <tr>
                                <td><b>Route Description</b></td>
                                <td>Deliquency Route</td>
                            </tr>
                            <tr>
                                <td><b>Route Status</b></td>
                                <td class="Success">Active</td>
                            </tr>
                        </tbody>
                        
                    </table>
                <div class="botton-div d-flex justify-content-center">
                    <button class="btn1">Edit</button>
                    <button class="btn2">Delete</button>
                </div>
             
            </div>
          </div>
     </div>

        
    </div>
</div>
