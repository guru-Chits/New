<div class = "container-fluid">
    <div class = "row d-flex ">

        <div [ngClass]="{'col-md-8 col-lg-8': regionDetail, 'col-md-12 col-lg-12': !regionDetail}">
           <div class = "d-flex col mt-2">
            <div class = "d-flex col">
                <app-breadcrumb [data]="breadcrumsData"></app-breadcrumb>
            </div>
            <div class = "d-flex col justify-content-end">
                <button  routerLink="routecreate" class="btn">Create New Route</button>
            </div>
           </div>
           <div class="d-flex col ">
            <form class="form" [formGroup]="regionForm">
            <div class="d-flex row form-group mt-5 mb-5">
                <div class="col-lg-4">
                    <label class="simple-text">Region Name</label>
                    <input class = "form-control" placeholder="Enter your region" formControlName="regionName">    
                </div>
            <div class="col-lg-4">
                <label class="simple-text">Region ID</label>
                <input class = "form-control" placeholder="Enter your Region ID" formControlName ="regionId">
            </div>
            <div class="col-lg-4">
                <label class="simple-text">Region Description</label>
                <input class = "form-control" placeholder="Region Description" formControlName="regionDesc">
            </div>
        </div>
        </form>
      </div>
      <div class="col d-flex">
        <div class="form-check form-switch switch-design">
            <input class="form-check-input" type="checkbox" role="switch" id="flexSwitchCheckChecked" checked>
            <label class="form-check-label" for="flexSwitchCheckChecked">Status of the Region</label>
          </div>
      </div>
      <div class="d-flex justify-content-end">
        <button class="btn1">Cancel</button>
        <button class="btn" (click)="onSubmit()">Save</button>
      </div>
      <app-ag-grid [columns]="column" [rowData]="data" width="100%" height="300px"></app-ag-grid> 
   
    </div>
     
     <div class="col-lg-4 d-flex mb-4">
     <div *ngIf="regionDetail">  
        <div class="card ">
            <div class="card-body">
                    <h6 class="text-center">Region details</h6>
                    <table class="table">
                        <tbody>
                            <tr>
                                <td>Region ID</td>
                                <td>{{regionDetail.Region.regionId}}</td>
                            </tr>
                            <tr>
                                <td>Region Name</td>
                                <td>{{regionDetail.Region.regionName}}</td>
                            </tr>
                            <tr>
                                <td>Region Description</td>
                                <td>{{regionDetail.Region.regionDesc}}</td>
                            </tr>
                            <tr>
                                <td>Region Status</td>
                                <td>
                                    {{regionDetail.Region.status ? 'Active' : 'Inactive' }}
                                </td>
                            </tr>
                        </tbody>
                        
                    </table>
                <div class="botton-div d-flex justify-content-center">
                    <button class="btn1">Edit</button>
                    <button class="btn2">Delete</button>
                </div>
             
            </div>
          
        </div>

     </div>  
     </div>
