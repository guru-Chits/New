<div class="container-fluid mt-4">
  <div class="row">
      <div class="col-lg-12">
          <ul class="nav">
              <li class="nav-item" (click)="selectTab('regular')" [class.active]="activeTab === 'regular'">
                <a class="nav-link">Regular Chit</a>
              </li>
              <li class="nav-item" (click)="selectTab('profit')" [class.active]="activeTab === 'profit'">
                <a class="nav-link">Profit Chit</a>
              </li>
              <li class="nav-item" (click)="selectTab('purchase')" [class.active]="activeTab === 'purchase'">
                <a class="nav-link">Purchase</a>
              </li>
              <li class="nav-item" (click)="selectTab('tkn')" [class.active]="activeTab === 'tkn'">
                <a class="nav-link">TKN Company</a>
              </li>
              <li class="nav-item" (click)="selectTab('extra')" [class.active]="activeTab === 'extra'">
                <a class="nav-link">Extra Payments</a>
              </li>
            </ul>
            <div class="items">
              <form [formGroup]="auctionForm" >
                  <div class="row justify-content-around">
                      <div class="col-lg-4">
                        <div class="form-group">
                          <label for="groupId" class="form-control-label">Group ID</label>
                          <input type="text" placeholder="Group Id" class="form-control form-control-sm" formControlName="groupId"/>
                        </div>
                      </div>
          
                      <div class="col-lg-4">
                        <div class="form-group">
                          <label for="walletBal" class="form-control-label">Wallet Balance</label>
                          <input type="text" placeholder="Wallet Balance" class="form-control form-control-sm" formControlName="walletBal"/>
                        </div>
                      </div>
          
                      <div class="col-lg-4">
                        <div class="form-group">
                          <label for="foreCommission" class="form-control-label">Foreman Commission</label>
                          <input type="text" placeholder="Foreman Commission" class="form-control form-control-sm" formControlName="foreCommission"/>
                        </div>
                      </div>
                    </div>
                    <div class="row justify-content-around">
                      <div class="col-lg-4">
                        <div class="form-group">
                          <label for="winBid" class="form-control-label">Winning Bid</label>
                          <input type="text" placeholder="Winning Bid" class="form-control form-control-sm" formControlName="winBid" />
                        </div>
                      </div>
          
                      <div class="col-lg-4">
                        <div class="form-group">
                          <label for="priAm" class="form-control-label">Prized Amount</label>
                          <input type="text" placeholder="Prizes Amount" class="form-control form-control-sm" formControlName="priAm" />
                        </div>
                      </div>
          
                      <div class="col-lg-4">
                        <div class="form-group">
                          <label for="ticketId" class="form-control-label">Ticket Id</label>
                          <input type="text" placeholder="Ticket Id" class="form-control form-control-sm" formControlName="ticketId" />
                        </div>
                      </div>
                    </div>
                    <div class="row justify-content-around">
                      <div class="col-lg-4">
                        <div class="form-group">
                          <label for="prizedSubName" class="form-control-label">Prized Subscriber Name</label>
                          <input type="text" placeholder="Prized Subscriber Name" class="form-control form-control-sm" formControlName="prizedSubName" />
                        </div>
                      </div>
          
                      <div class="col-lg-4">
                        <div class="form-group">
                          <label for="passbiokNumber" class="form-control-label">Passbook Number</label>
                          <input type="text" placeholder="Passbook Number" class="form-control form-control-sm" formControlName="passbookNumber" />
                        </div>
                      </div>
          
                      <div class="col-lg-4">
                        <div class="form-group">
                          <label for="ticketId" class="form-control-label">Auction Cycle</label>
                          <input type="text" placeholder="Ticket Id" class="form-control form-control-sm" formControlName="ticketId" />
                        </div>
                      </div>
                    </div>
                
                    <div class="row justify-content-around">
                      <div class="col-lg-3">
                      <div class="form-check form-switch">
                          <input class="form-check-input" type="checkbox" formControlName="auctionStart" role="switch" id="flexSwitchCheckChecked"  (change)="toggleFormControls()" >
                          <label class="form-check-label" for="flexSwitchCheckChecked">Working Status</label>
                        </div>                       
                       </div>
          
                      <div class="col-lg-3">
                          <button class="btn px-2 py-2" >Redeem TKN A/C</button>
                      </div>
                      <div class="col-lg-3">
                          <button class="btn px-2  py-2" >TKN Company</button>
                      </div>                       
                       <div class="col-lg-3">
                          <button class="btn px-2  py-2" >Create Invoice</button>
                      </div>
                    </div>
                  </form>
              <div class="my-4">
                  <h6 class="ps-3 pb-2">Subscribers</h6>
                  <app-ag-grid [columns]="subscriberColumn" [rowData]="subscribers"  [searchImg]="searchImg" [filterImg]="filterImg"  width="100%" height="200px"></app-ag-grid>

              </div>

              <div class="mt-3">
                  <h6 class="ps-3 pb-2">Additional Subscribers</h6>

                  <app-ag-grid [columns]="addSubscriberColumn" [rowData]="addSubscribers"  [searchImg]="searchImg" [filterImg]="filterImg"  width="100%" height="200px"></app-ag-grid>

              </div>
              <div class="row justify-content-center">
                  <div class="col-lg-12 d-flex justify-content-end mb-2">
                      <button class="btn nxt-btn btn-outline-secondary">Cancel</button>
                  </div>
              </div>
            </div>

      </div>
  </div>

</div>
