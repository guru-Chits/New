<div class="container-fluid">
    <div class="row">
        <div class="col-lg-9">
            <form (ngSubmit)="onSubmit()">
                <div class="row justify-content-around">
                    <div class="col-lg-4">
                        <div class="form-group">
                            <label for="datetime" class="form-control-label">Auction Date</label>
                            <input type="date" class="form-control p-2 form-control-sm mt-2" id="datetime" formControlName="datetime" placeholder="Date"/>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="form-group">
                            <label for="chitAmount" class="form-control-label">Chit Amount</label>
                            <input class="form-control p-2 form-control-sm mt-2" id="chitAmount" formControlName="chitAmount" placeholder="Chit Amount"/>
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="form-group">
                            <label for="foremanCommission" class="form-control-label">Foreman Commission</label>
                            <input class="form-control p-2 form-control-sm mt-2" id="foremanCommission" formControlName="foremanCommission" placeholder="Foreman Commission"/>
                        </div>
                    </div>
                </div>
                <div class="row justify-content-start">
                    <div class="col-lg-4">
                        <div class="form-group">
                            <label for="monthlyInstall" class="form-control-label ">Monthly Installment</label>
                            <input class="form-control p-2 form-control-sm mt-2" id="monthlyInstall" formControlName="monthlyInstall" placeholder="Monthly Installment"/>
                        </div>
                    </div>
                </div>
                <div class="row justify-content-start ">
                    <div class="col-lg-4">
                        <div class="d-flex justify-content-around align-items-center">
                            <button class="btn btn-upload border border-secondary py-1">Document Upload</button>
                            <span class="doc-name">document.pdf</span>
                        </div>
                    </div>
                </div>
                <!-- <div class="row justify-content-start">
                    <div class="col-lg-4">
                        <div class="d-flex justify-content-around align-items-center">
                            <input type="file" id="fileInput" (change)="onFileSelected($event)" style="display: none;" />
                            <button class="btn btn-upload border border-secondary py-1" (click)="triggerFileInput()">Document Upload</button>
                            <span class="doc-name">{{ uploadedFileName }}</span>
                        </div>
                    </div>
                </div> -->
                <div class="row">
                    <div class="col-lg-12 d-flex justify-content-end py-3">
                        <button type="button" class="btn next-btn px-4 py-3 fw-bold">Add Subscribers</button>
                    </div>
                </div>
            </form>
            <app-ag-grid [columns]="column" [rowData]="data" class="px-3" width="100%" height="300px"></app-ag-grid>
            <div class="row">
                <div class="col-lg-12 d-flex justify-content-end py-3">
                    <button type="button" class="btn next-btn px-4 py-3 fw-bold">Add Additional Subscribers</button>
                </div>
            </div>
            <app-ag-grid [columns]="column" [rowData]="data" class="px-3" width="100%" height="300px"></app-ag-grid>
            <div class="row">
                <div class="col-lg-12 d-flex justify-content-end py-3">
                    <button type="button" class="btn next-btn px-4 py-3 fw-bold">Create Group</button>
                </div>
            </div> 
        </div>
    </div>
</div>
