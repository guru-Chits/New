<div class="container-fluid" *ngIf="!verified && !newStaff">
    <div class="row d-flex">
      <!-- <div class="col-lg-1 col-md-1 align-self-center">
        
      </div> -->
      <div class="col-lg-6 col-md-6 align-self-center">
            <img src="/assets/login/login.svg"  alt="" class="img-fluid  clipart">            
          </div>    
      <div class="col-lg-6 col-md-6 flex align-center justify-center">
        <div class="d-flex flex-column gap-4 align-items-center">
          <div class="card-title">
            <img src="\assets\login\logo.svg" alt=""  class="img-fluid logo">
        </div>
          <div class="card col-lg-6 col-md-6 d-flex p-0 flex-column">
            <div class="card-body">
            <form [formGroup]="loginForm" class="col-lg-12 col-md-12 d-flex flex-column px-4">
              <div class="mt-2 pl-0 sign-in-label">Login</div>
              <div class="mt-3 pl-0 sign-in-text">Welcome Back! Please Enter your Details</div>

              <div class="form-group mt-4">
                <!-- <label for="employeeId" class="form-control-label">employeeId</label> -->
                 <label
                 class ="form-label"
                 >Employee ID</label>
                <input  type="employeeId"
                        class="form-control"
                        id="employeeId"
                        placeholder="Enter Employee ID"
                        name="employeeId"
                        formControlName="employeeId"
                        [ngClass]="{ 'is-invalid': employeeIdControl.touched && employeeIdControl.invalid}"
                        > 
                          
                        <div class="invalid-feedback">
                           <span *ngIf="employeeIdControl.hasError('required')">This field is required</span> 
                          <span *ngIf="employeeIdControl.hasError('pattern')">employeeId must be an official employeeId id</span> 
                        </div>
                        <div class="mb-3 form-group">
                          <label for="password" class="form-control-label" style="font-size:14px; font-weight: 700;">Password</label>
                          <div class=" input-fields  d-flex align-items-center"
                          [ngClass]="{'is-invalid': passwordControl.touched && passwordControl.hasError('required') || !passwordsMatch||passwordControl.hasError('pattern')||passwordControl.hasError('maxlength')||passwordControl.hasError('minlength')}">
                              <input [type]=" isPasswordVisible ? 'text': 'password'" class="form-control" id="password"
                              placeholder="Enter password"
                               required
                               formControlName="password">
                              <img src="\assets\login\Eye.svg" class="img-fluid mx-1"
                               [ngClass]="{' eyebtn-opacity': isPwdEmpty}" *ngIf="!isPasswordVisible"
                               (click)="togglePasswordVisibility()" height="20px" width="20px" >
                                <img src="\assets\login\Invisible.svg" class="img-fluid mx-1"
                                *ngIf="isPasswordVisible"(click)="togglePasswordVisibility()" height="20px" width="20px" >
                          </div>
                          <div class="invalid-feedback  col-9">
                            <span  *ngIf="passwordControl.touched && passwordControl.hasError('required')" >
                            Password is required
                            </span>
                            <span  *ngIf="passwordControl.touched && passwordControl.hasError('pattern')">
                            New password should be  mix of letters, numbers, and specials
                            </span>
                            <span  *ngIf="passwordControl.touched && passwordControl.hasError('maxlength')">
                            Maximum Length 12
                            </span>
                            <span  *ngIf="passwordControl.touched && passwordControl.hasError('minlength')">
                            Manimum Length 8
                            </span>
                          </div>
                          </div>
                          <div class="row justify-content-center">
                            <div class="col-lg-11 d-flex justify-content-end" >
                            <p   routerLink="/login/fp" style="color:#3E3A97;cursor: pointer;" >Forgot Password ?</p>

                          </div>

                        </div>
              </div>
              <button type="submit" class="btn login col-lg-12 col-md-12 mb-3 mt-3" [disabled]="!loginForm.valid" (click)="onSubmit()">Login</button>
              
            </form>
          </div>
         </div>
        </div>
      </div>
    </div>
  </div>

  <div *ngIf="verified">
<app-verify [mobileNumber]="mobileNumber"></app-verify>
  </div>

  <div *ngIf="newStaff">
    <app-verify [mobileNumber]="mobileNumber" [employeeId]="employeeId" [reset]="reset"></app-verify>
  </div>
