<!-- ag-grid.component.html -->

<div class="container">

 <div class="search-filter-container mb-3">

      <div class="search-box">
        <input  width="20" height="20" type="text"   
        id="filter-text-box"
        placeholder="Search"
        (input)="onFilterTextBoxChanged()"
        />
        <span class="search-icon"><img src="assets/table/search.svg"></span>
      </div>
        <button class="filter-button">
        <img src="assets/table/Icon.svg">
       </button>
    </div>


  <ag-grid-angular 
    [rowData]="rowData"
    [columnDefs]="columns"
    class="ag-theme-balham custom-grid"
    [ngStyle]="{ 'width': width, 'height': height }"
    [defaultColDef]="defaultColDef"
    (gridReady)="onGridReady($event)"
    [pagination]="true"
    [paginationPageSize]="5">
  </ag-grid-angular>
